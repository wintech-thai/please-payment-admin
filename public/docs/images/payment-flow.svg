<svg width="720" height="180" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" font-family="Prompt, sans-serif">
  <!-- Background -->
  <rect width="720" height="180" fill="#18181b" rx="12"/>

  <!-- Step boxes -->
  <!-- 1: Merchant -->
  <rect x="30" y="60" width="120" height="60" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="90" y="87" text-anchor="middle" fill="#f4f4f5" font-size="13" font-weight="600">Merchant</text>
  <text x="90" y="106" text-anchor="middle" fill="#a1a1aa" font-size="11">สร้าง QR Code</text>

  <!-- Arrow 1 -->
  <line x1="150" y1="90" x2="200" y2="90" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="175" y="82" text-anchor="middle" fill="#71717a" font-size="10">POST /api</text>

  <!-- 2: API Server -->
  <rect x="200" y="60" width="120" height="60" rx="8" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="87" text-anchor="middle" fill="#f4f4f5" font-size="13" font-weight="600">API Server</text>
  <text x="260" y="106" text-anchor="middle" fill="#93c5fd" font-size="11">ออก QR + session</text>

  <!-- Arrow 2 -->
  <line x1="320" y1="90" x2="370" y2="90" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="345" y="82" text-anchor="middle" fill="#71717a" font-size="10">QR Code</text>

  <!-- 3: Customer -->
  <rect x="370" y="60" width="120" height="60" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="430" y="87" text-anchor="middle" fill="#f4f4f5" font-size="13" font-weight="600">Customer</text>
  <text x="430" y="106" text-anchor="middle" fill="#a1a1aa" font-size="11">Scan &amp; โอนเงิน</text>

  <!-- Arrow 3 -->
  <line x1="490" y1="90" x2="540" y2="90" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="515" y="82" text-anchor="middle" fill="#71717a" font-size="10">Webhook</text>

  <!-- 4: API → SignalR -->
  <rect x="540" y="60" width="150" height="60" rx="8" fill="#1a3320" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="87" text-anchor="middle" fill="#f4f4f5" font-size="13" font-weight="600">API → SignalR</text>
  <text x="615" y="106" text-anchor="middle" fill="#86efac" font-size="11">payment.completed</text>

  <!-- Step numbers -->
  <circle cx="90" cy="48" r="12" fill="#3f3f46"/>
  <text x="90" y="52" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">1</text>

  <circle cx="260" cy="48" r="12" fill="#2563eb"/>
  <text x="260" y="52" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2</text>

  <circle cx="430" cy="48" r="12" fill="#3f3f46"/>
  <text x="430" y="52" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">3</text>

  <circle cx="615" cy="48" r="12" fill="#16a34a"/>
  <text x="615" y="52" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#52525b"/>
    </marker>
  </defs>
</svg>
