<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="payGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="payGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#payGlow)">
    <!-- Card outline -->
    <rect x="10" y="25" width="100" height="70" rx="12" stroke="url(#payGrad)" stroke-width="5"/>

    <!-- Stripe -->
    <rect x="10" y="44" width="100" height="16" fill="url(#payGrad)" fill-opacity="0.25"/>

    <!-- EMV Chip -->
    <rect x="20" y="31" width="22" height="16" rx="4" stroke="url(#payGrad)" stroke-width="2.5"/>
    <line x1="31" y1="31" x2="31" y2="47" stroke="url(#payGrad)" stroke-width="1.5"/>
    <line x1="20" y1="39" x2="42" y2="39" stroke="url(#payGrad)" stroke-width="1.5"/>

    <!-- Card number dots -->
    <circle cx="26" cy="72" r="4.5" fill="url(#payGrad)"/>
    <circle cx="41" cy="72" r="4.5" fill="url(#payGrad)"/>
    <circle cx="56" cy="72" r="4.5" fill="url(#payGrad)"/>
    <circle cx="71" cy="72" r="4.5" fill="url(#payGrad)"/>

    <!-- Contactless symbol -->
    <circle cx="90" cy="60" r="3.5" fill="url(#payGrad)"/>
    <path d="M86 53 Q96 60 86 67" stroke="url(#payGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M82 49 Q98 60 82 71" stroke="url(#payGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
</svg>
