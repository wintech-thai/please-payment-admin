<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">Application installation architecture</title>
  <desc id="desc">A VM hosts K3s, Argo CD, ingress, certificate management, application services, metrics monitoring, log monitoring, and Discord alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#090d17"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.label{font:700 23px Arial,sans-serif;fill:#f8fafc}.body{font:16px Arial,sans-serif;fill:#cbd5e1}.small{font:14px Arial,sans-serif;fill:#94a3b8}.box{fill:#172033;stroke:#334155;stroke-width:1.5}.line{stroke:#64748b;stroke-width:2;stroke-dasharray:6 6}.pill{fill:#243044}.accent{fill:url(#accent)}</style>
  </defs>
  <rect width="1280" height="780" rx="28" fill="url(#bg)"/>
  <text x="64" y="76" class="label" font-size="32">Application on your infrastructure</text>
  <text x="64" y="108" class="body">ติดตั้งทุกส่วนบน VM เดียวผ่าน K3s และ Argo CD</text>
  <rect x="64" y="150" width="1152" height="564" rx="24" class="box" filter="url(#shadow)"/>
  <rect x="96" y="182" width="1088" height="72" rx="14" class="accent"/>
  <text x="128" y="226" class="label">Ubuntu VM · 8 vCPU · 32 GiB RAM · 300 GiB SSD (recommended)</text>
  <rect x="96" y="282" width="1088" height="394" rx="18" fill="#101827" stroke="#263449" stroke-width="1.5"/>
  <text x="128" y="324" class="label">K3s Kubernetes</text>
  <text x="128" y="350" class="small">single-node platform</text>
  <line x1="414" y1="390" x2="414" y2="608" class="line"/>
  <line x1="782" y1="390" x2="782" y2="608" class="line"/>
  <g filter="url(#shadow)">
    <rect x="128" y="390" width="250" height="104" rx="14" class="box"/>
    <text x="152" y="428" class="label">Ingress</text><text x="152" y="456" class="body">ingress-nginx · cert-manager</text><text x="152" y="480" class="body">origin certificate setup required</text>
    <rect x="128" y="534" width="250" height="104" rx="14" class="box"/>
    <text x="152" y="572" class="label">Argo CD</text><text x="152" y="600" class="body">sync configuration from Git</text>
    <rect x="446" y="390" width="304" height="248" rx="14" fill="#1d2638" stroke="#fb923c" stroke-width="2"/>
    <text x="470" y="428" class="label">Application</text><text x="470" y="462" class="body">Admin · Merchant · API</text><text x="470" y="490" class="body">Jobs · PostgreSQL · Redis</text><rect x="470" y="534" width="184" height="44" rx="22" class="accent"/><text x="491" y="562" class="label" font-size="16">Business workloads</text>
    <rect x="814" y="390" width="330" height="104" rx="14" class="box"/>
    <text x="838" y="428" class="label">Configuration</text><text x="838" y="456" class="body">external-secrets · local PV</text>
    <rect x="814" y="534" width="330" height="104" rx="14" class="box"/>
    <text x="838" y="572" class="label">Metrics &amp; alerts</text><text x="838" y="600" class="body">Prometheus/Grafana</text><text x="838" y="624" class="body">Discord alert notifications</text>
  </g>
  <rect x="106" y="734" width="218" height="28" rx="14" class="pill"/><text x="126" y="754" class="small">admin · merchant · api</text>
  <text x="352" y="754" class="small">DNS routes traffic to ingress, then to the appropriate service</text>
</svg>
